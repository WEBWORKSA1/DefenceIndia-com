<form class="form" data-di-form="Industry / Vendor Enquiry" data-success="Enquiry received. Our industry desk will respond within 2 business days.">
<h3>Industry, Vendor &amp; Partnership Enquiry</h3><p class="sub">For MSMEs, start-ups, OEMs, investors and buyers — directory listing, RFQ routing, iDEX guidance, sponsored features and partnerships.</p>
<div class="field-row"><div class="field"><label>Company / organisation *</label><input name="company" required></div><div class="field"><label>Contact person *</label><input name="name" required></div></div>
<div class="field-row"><div class="field"><label>Work email *</label><input name="email" type="email" required></div><div class="field"><label>Phone *</label><input name="phone" type="tel" required></div></div>
<div class="field-row"><div class="field"><label>Organisation type</label><select name="type"><option>MSME / manufacturer</option><option>Start-up</option><option>Large enterprise / OEM</option><option>DPSU / Government</option><option>Investor / fund</option><option>Consultant / legal</option><option>Media / PR</option><option>Other</option></select></div><div class="field"><label>I am interested in</label><select name="interest"><option>Listing in vendor directory</option><option>Receiving RFQs / tenders in my domain</option><option>iDEX / DISC application guidance</option><option>Sponsored feature / press release</option><option>Advertising package</option><option>Partnership / JV introductions</option><option>Acquiring / sponsoring this website or domain</option></select></div></div>
<div class="field"><label>Capabilities / requirement *</label><textarea name="message" required placeholder="Products, certifications (ISO/AS9100/DGQA), domains (iDEX taxonomy), turnover band, what you need from us"></textarea></div>
<input class="hp" name="_hp" tabindex="-1" autocomplete="off"><div class="field"><label class="consent"><input type="checkbox" name="consent" value="yes" required><span>I agree to be contacted about my enquiry and accept the <a href="{{ site.baseurl }}/privacy/">privacy policy</a>. No spam, ever.</span></label></div><button class="btn btn-primary" type="submit" data-label="Send enquiry">Send enquiry</button><div class="form-status" role="status"></div>
<div class="trust"><span>Confidential</span><span>Response in 2 business days</span><span>No listing fees for basic profiles</span></div></form>
